  <script>
    /**
     * Set up the theme background colour based on the query, to avoid
     * flashing a white background before rendering
     */
    function setThemeBackground() {
      const location = new URL(window.location.toString());
      let theme = location.searchParams.get('theme') ?? "";
      switch (theme) {
        case "light-gray":
          console.log("Setting light-gray background");
          document.body.style.backgroundColor = "#f5f5f5";
          break;
        case "dark-blue":
          console.log("Setting dark-blue background");
          document.body.style.backgroundColor = "#3B4453";
          break;
        case "dark-gray":
          console.log("Setting dark-gray background");
          document.body.style.backgroundColor = "#474747";
          break;
      }
    }
  </script>
